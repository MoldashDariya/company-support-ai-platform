# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy as a Background Worker (Telegram long-polling bot).

services:
  - type: worker
    name: company-support-ai-bot
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: RETRIEVAL_MODE
        value: hybrid
      - key: ENABLE_BM25
        value: "true"
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: CITATION_INCLUDE_URLS
        value: "true"
      - key: CORPUS_LANGUAGE
        value: ru
      # First deploy builds Chroma from data/company_knowledge.md (may take a few minutes)
      - key: HF_HOME
        value: /tmp/huggingface
