# Render Blueprint — https://render.com/docs/blueprint-spec
# Web Service: health HTTP on PORT + Telegram long-polling in the same process.

services:
  - type: web
    name: company-support-ai-bot
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: ENABLE_SEMANTIC_SEARCH
        value: "false"
      - key: RETRIEVAL_MODE
        value: sparse
      - key: ENABLE_BM25
        value: "true"
      - key: CITATION_INCLUDE_URLS
        value: "true"
      - key: CORPUS_LANGUAGE
        value: ru
